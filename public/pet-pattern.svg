<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <style>
      .c1 { fill: #7ED6C1; }
      .c2 { fill: #F7E8A4; }
      .c3 { fill: #a8e6da; }
      .c4 { fill: #f0d070; }
    </style>
  </defs>

  <!-- === PAW PRINT (top-left area) === -->
  <g transform="translate(28, 20) rotate(-15, 20, 20)" class="c1">
    <!-- main pad -->
    <ellipse cx="20" cy="26" rx="9" ry="7"/>
    <!-- toes -->
    <ellipse cx="10" cy="17" rx="4.5" ry="3.5"/>
    <ellipse cx="20" cy="13" rx="4.5" ry="3.5"/>
    <ellipse cx="30" cy="17" rx="4.5" ry="3.5"/>
    <ellipse cx="36" cy="25" rx="3.5" ry="3"/>
  </g>

  <!-- === BONE (top-right area) === -->
  <g transform="translate(235, 18) rotate(35, 30, 12)" class="c2">
    <rect x="13" y="9" width="34" height="6" rx="3"/>
    <circle cx="12" cy="12" r="6"/>
    <circle cx="48" cy="12" r="6"/>
  </g>

  <!-- === YARN BALL (mid-left) === -->
  <g transform="translate(12, 110)" class="c4">
    <circle cx="20" cy="20" r="16"/>
    <!-- yarn lines -->
    <path d="M6,14 Q20,4 34,14" stroke="#c8a800" stroke-width="1.8" fill="none"/>
    <path d="M5,22 Q20,12 35,22" stroke="#c8a800" stroke-width="1.8" fill="none"/>
    <path d="M6,29 Q20,19 34,29" stroke="#c8a800" stroke-width="1.8" fill="none"/>
    <path d="M12,6 Q18,20 12,34" stroke="#c8a800" stroke-width="1.8" fill="none"/>
    <path d="M28,6 Q22,20 28,34" stroke="#c8a800" stroke-width="1.8" fill="none"/>
  </g>

  <!-- === FISH (top-center) === -->
  <g transform="translate(118, 12) rotate(10, 24, 16)" class="c3">
    <!-- body -->
    <ellipse cx="22" cy="16" rx="15" ry="9"/>
    <!-- tail -->
    <polygon points="37,7 48,2 48,30 37,25"/>
    <!-- eye -->
    <circle cx="12" cy="14" r="2.5" fill="#4db8a4"/>
    <circle cx="11.5" cy="13.5" r="1" fill="white"/>
  </g>

  <!-- === HEART (right side) === -->
  <g transform="translate(276, 65) rotate(10, 14, 14)" class="c1">
    <path d="M14,24 C14,24 2,15 2,8 C2,4 5,2 8,2 C11,2 14,5 14,5 C14,5 17,2 20,2 C23,2 26,4 26,8 C26,15 14,24 14,24 Z"/>
  </g>

  <!-- === SMALL PAW (center area) === -->
  <g transform="translate(148, 88) rotate(20, 14, 14)" class="c2">
    <ellipse cx="14" cy="19" rx="6" ry="5"/>
    <ellipse cx="7" cy="12" rx="3" ry="2.5"/>
    <ellipse cx="14" cy="9" rx="3" ry="2.5"/>
    <ellipse cx="21" cy="12" rx="3" ry="2.5"/>
  </g>

  <!-- === DOG BONE small (bottom-left) === -->
  <g transform="translate(30, 190) rotate(-20, 22, 9)" class="c3">
    <rect x="10" y="6" width="24" height="5" rx="2.5"/>
    <circle cx="9" cy="8.5" r="5"/>
    <circle cx="35" cy="8.5" r="5"/>
  </g>

  <!-- === BALL (bottom-right) === -->
  <g transform="translate(255, 190)">
    <circle cx="22" cy="22" r="18" fill="#7ED6C1"/>
    <path d="M10,8 Q22,4 34,8 Q28,22 34,36 Q22,40 10,36 Q16,22 10,8 Z" fill="none" stroke="#4db8a4" stroke-width="2"/>
    <path d="M4,22 Q10,16 16,22 Q10,28 4,22 Z" fill="none" stroke="#4db8a4" stroke-width="2"/>
  </g>

  <!-- === STAR / sparkle (random spots) === -->
  <g transform="translate(200, 90)" class="c4">
    <polygon points="10,0 12.2,7.6 20,7.6 13.9,12.3 16.2,20 10,15.3 3.8,20 6.1,12.3 0,7.6 7.8,7.6" />
  </g>

  <!-- === CAT FACE (center bottom area) === -->
  <g transform="translate(130, 175)">
    <circle cx="22" cy="22" r="18" fill="#F7E8A4"/>
    <!-- ears -->
    <polygon points="7,8 14,20 1,18" fill="#F7E8A4" stroke="#d4c060" stroke-width="1"/>
    <polygon points="37,8 30,20 43,18" fill="#F7E8A4" stroke="#d4c060" stroke-width="1"/>
    <!-- inner ears -->
    <polygon points="8,10 13,19 4,17" fill="#f0a0b0"/>
    <polygon points="36,10 31,19 40,17" fill="#f0a0b0"/>
    <!-- eyes -->
    <ellipse cx="15" cy="24" rx="4" ry="3" fill="#7ED6C1"/>
    <ellipse cx="29" cy="24" rx="4" ry="3" fill="#7ED6C1"/>
    <circle cx="15" cy="24" r="2" fill="#333"/>
    <circle cx="29" cy="24" r="2" fill="#333"/>
    <circle cx="14.3" cy="23.3" r="0.8" fill="white"/>
    <circle cx="28.3" cy="23.3" r="0.8" fill="white"/>
    <!-- nose -->
    <ellipse cx="22" cy="30" rx="2" ry="1.5" fill="#f080a0"/>
    <!-- whiskers -->
    <line x1="2" y1="28" x2="14" y2="30" stroke="#888" stroke-width="1.2"/>
    <line x1="2" y1="32" x2="14" y2="32" stroke="#888" stroke-width="1.2"/>
    <line x1="30" y1="30" x2="42" y2="28" stroke="#888" stroke-width="1.2"/>
    <line x1="30" y1="32" x2="42" y2="32" stroke="#888" stroke-width="1.2"/>
    <!-- mouth -->
    <path d="M19,33 Q22,37 25,33" stroke="#888" stroke-width="1.2" fill="none"/>
  </g>

  <!-- === FOOD BOWL (bottom-right area) === -->
  <g transform="translate(252, 260)" class="c2">
    <!-- bowl body -->
    <ellipse cx="22" cy="22" rx="20" ry="12"/>
    <ellipse cx="22" cy="16" rx="20" ry="8" fill="#F7E8A4"/>
    <ellipse cx="22" cy="16" rx="12" ry="5" fill="#e8c840"/>
    <!-- kibbles -->
    <circle cx="18" cy="15" r="2.5" fill="#c8a800"/>
    <circle cx="24" cy="14" r="2.5" fill="#c8a800"/>
    <circle cx="22" cy="18" r="2" fill="#c8a800"/>
    <!-- rim line -->
    <ellipse cx="22" cy="22" rx="20" ry="12" fill="none" stroke="#d4c060" stroke-width="1.5"/>
  </g>

  <!-- === TINY PAWS scattered === -->
  <g transform="translate(80, 60) rotate(30, 8, 8)" class="c1" opacity="0.6">
    <ellipse cx="8" cy="11" rx="4" ry="3"/>
    <ellipse cx="3.5" cy="6.5" rx="2.3" ry="1.8"/>
    <ellipse cx="8" cy="4.5" rx="2.3" ry="1.8"/>
    <ellipse cx="12.5" cy="6.5" rx="2.3" ry="1.8"/>
  </g>

  <g transform="translate(186, 155) rotate(-10, 8, 8)" class="c2" opacity="0.7">
    <ellipse cx="8" cy="11" rx="4" ry="3"/>
    <ellipse cx="3.5" cy="6.5" rx="2.3" ry="1.8"/>
    <ellipse cx="8" cy="4.5" rx="2.3" ry="1.8"/>
    <ellipse cx="12.5" cy="6.5" rx="2.3" ry="1.8"/>
  </g>

  <!-- === DOG PAW big (bottom-left corner) === -->
  <g transform="translate(8, 265) rotate(10, 20, 20)" class="c2">
    <ellipse cx="20" cy="26" rx="9" ry="7"/>
    <ellipse cx="10" cy="17" rx="4.5" ry="3.5"/>
    <ellipse cx="20" cy="13" rx="4.5" ry="3.5"/>
    <ellipse cx="30" cy="17" rx="4.5" ry="3.5"/>
    <ellipse cx="36" cy="25" rx="3.5" ry="3"/>
  </g>

  <!-- === YARN BALL 2 (top-right corner) === -->
  <g transform="translate(282, 4)" class="c1">
    <circle cx="16" cy="16" r="13"/>
    <path d="M5,11 Q16,4 27,11" stroke="#4db8a4" stroke-width="1.6" fill="none"/>
    <path d="M4,18 Q16,11 28,18" stroke="#4db8a4" stroke-width="1.6" fill="none"/>
    <path d="M5,24 Q16,17 27,24" stroke="#4db8a4" stroke-width="1.6" fill="none"/>
    <path d="M10,4 Q15,16 10,28" stroke="#4db8a4" stroke-width="1.6" fill="none"/>
    <path d="M22,4 Q17,16 22,28" stroke="#4db8a4" stroke-width="1.6" fill="none"/>
  </g>

  <!-- === FISH BONE / small fish right === -->
  <g transform="translate(68, 240) rotate(-15, 20, 12)" class="c3">
    <ellipse cx="18" cy="12" rx="12" ry="7"/>
    <polygon points="30,6 40,2 40,22 30,18"/>
    <circle cx="9" cy="10" r="2" fill="#4db8a4"/>
    <circle cx="8.5" cy="9.5" r="0.8" fill="white"/>
  </g>

  <!-- === HEART small (left center) === -->
  <g transform="translate(0, 160) rotate(-10, 10, 10)" class="c2" opacity="0.8">
    <path d="M10,18 C10,18 1,11 1,5.5 C1,2.5 3.5,1 6,1 C8,1 10,3.5 10,3.5 C10,3.5 12,1 14,1 C16.5,1 19,2.5 19,5.5 C19,11 10,18 10,18 Z"/>
  </g>

  <!-- === SPARKLE stars === -->
  <g transform="translate(295, 145)" class="c1" opacity="0.7">
    <polygon points="8,0 9.8,6 16,6 11,9.8 13,16 8,12 3,16 5,9.8 0,6 6.2,6"/>
  </g>

  <g transform="translate(58, 160)" class="c3" opacity="0.5">
    <polygon points="6,0 7.4,4.6 12,4.6 8.3,7.4 9.7,12 6,9.2 2.3,12 3.7,7.4 0,4.6 4.6,4.6"/>
  </g>

  <!-- === SMALL BONE top-center === -->
  <g transform="translate(88, 4) rotate(-5, 18, 8)" class="c1" opacity="0.7">
    <rect x="8" y="5" width="20" height="5" rx="2.5"/>
    <circle cx="7" cy="7.5" r="4.5"/>
    <circle cx="29" cy="7.5" r="4.5"/>
  </g>

  <!-- === DOG FACE (right area) === -->
  <g transform="translate(208, 210)">
    <circle cx="25" cy="25" r="20" fill="#7ED6C1"/>
    <!-- ears -->
    <ellipse cx="10" cy="14" rx="7" ry="10" fill="#4db8a4" transform="rotate(-15, 10, 14)"/>
    <ellipse cx="40" cy="14" rx="7" ry="10" fill="#4db8a4" transform="rotate(15, 40, 14)"/>
    <!-- snout -->
    <ellipse cx="25" cy="32" rx="10" ry="7" fill="#a8e6da"/>
    <!-- eyes -->
    <circle cx="18" cy="22" r="3.5" fill="#333"/>
    <circle cx="32" cy="22" r="3.5" fill="#333"/>
    <circle cx="17.2" cy="21.2" r="1.2" fill="white"/>
    <circle cx="31.2" cy="21.2" r="1.2" fill="white"/>
    <!-- nose -->
    <ellipse cx="25" cy="28" rx="4" ry="2.5" fill="#333"/>
    <!-- mouth -->
    <path d="M21,32 Q25,36 29,32" stroke="#333" stroke-width="1.5" fill="none"/>
    <!-- tongue -->
    <ellipse cx="25" cy="36" rx="3.5" ry="2.5" fill="#f080a0"/>
  </g>

</svg>
